[package]
name = "staketrace"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
authors = ["intelliDean <o.michaeldean@gmail.com>", "Staketrace Contributors"]
description = "High-assurance CLI tool and library to trace, simulate, and verify Ethereum validator consolidations (EIP-7251 MaxEB) and exits (EIP-7002) across Execution and Consensus layers."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/intelliDean/staketrace"
homepage = "https://github.com/intelliDean/staketrace"
keywords = ["ethereum", "eip-7251", "maxeb", "staking", "validator"]
categories = ["command-line-utilities", "cryptography::cryptocurrencies"]

[lib]
name = "staketrace"
path = "src/lib.rs"

[[bin]]
name = "staketrace"
path = "src/main.rs"

[dependencies]
# CLI & Terminal UX
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"
comfy-table = "7.2"
colored = "3.1"
indicatif = "0.17"

# Async & Networking
tokio = { version = "1.53", features = ["full"] }
reqwest = { version = "0.12", features = [
    "json",
    "rustls-tls",
], default-features = false }
url = "2.5"

# Ethereum & Alloy
alloy-primitives = { version = "0.8", features = ["serde"] }

# Serialization & Formats
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
csv = "1.4"
hex = "0.4"

# Error Handling & Logging
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3.27"
